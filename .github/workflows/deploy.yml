name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      # The responsive variants are pure build artefacts, and a cold encode of
      # them is most of a build. The key is the pipeline's own signature - the
      # frames the pages name, the originals they come from, the grade, the two
      # scripts and their config - which is exactly what the script's freshness
      # check compares against the manifest. So a hit is a tree the build
      # accepts as up to date, and anything that would re-encode misses the key
      # and is saved under the new one.
      - id: variants
        run: echo "key=variants-$(node scripts/responsive-images.mjs --signature)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: public/images/variants
          key: ${{ steps.variants.outputs.key }}
      - run: npm run build:pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
