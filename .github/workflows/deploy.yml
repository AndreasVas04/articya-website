name: Pages redirect

# The site is built and served by Vercel, from this repository, on every push.
# GitHub Pages keeps the project's old address alive as redirects to it (see
# scripts/pages-redirect.mjs), so this deploys only when those change.
on:
  push:
    branches: [main]
    paths:
      - scripts/pages-redirect.mjs
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - run: node scripts/pages-redirect.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
